<!DOCTYPE html>
<html lang="es">
  <head>
  <meta charset="UTF-8">
  <title>Para Anita </title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #1f1f1f;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    text-align: center;
    padding: 10px;
    box-sizing: border-box;
    overflow: hidden;
  }

  #contenido {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* Contenedor que da perspectiva 3D */
  #cartaContainer {
    height: min(88dvh, 900px);
    aspect-ratio: 2 / 3;
    perspective: 1400px;
    cursor: pointer;
  }

  /* Elemento que realmente gira */
  #carta {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(.4,.2,.2,1);
  }

  /* Al agregar esta clase gira 180 grados */
  #carta.girada {
    transform: rotateY(180deg);
  }

  .cara {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  }

  .cara img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Frente inicialmente está dado vuelta */
  .frente {
    transform: rotateY(180deg);
  }

  #textoMedio {
    margin-top: 25px;
  }

  #textoMedio h2 {
    font-size: 1.4rem;
    animation: pulse 1.5s infinite;
  }

  #pantallaFinal {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  #comprobante {
    width: min(90vw, 700px);
    max-height: 70dvh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  #textoFinal h2 {
    font-size: 1.8rem;
  }

  #textoFinal p {
    font-size: 1.2rem;
  }

  @keyframes pulse {
    0% {
      transform: scale(1);
      opacity: 0.7;
    }

    50% {
      transform: scale(1.05);
      opacity: 1;
    }

    100% {
      transform: scale(1);
      opacity: 0.7;
    }
  }
  </style>
  </head>
<body>

  <div id="contenido">

    <!-- CARTA -->
    <div id="cartaContainer">
      <div id="carta">

        <!-- Dorso -->
        <div class="cara dorso">
          <img src="carta_back.jpg" alt="Carta de tarot">
        </div>

        <!-- Frente -->
        <div class="cara frente">
          <img src="carta_front.jpg" alt="Carta de tarot revelada">
        </div>

      </div>
    </div>

    <div id="textoMedio">
  <h2>👆 Toca para tirar el tarot 🔮</h2>
</div>

  </div>


  <!-- PANTALLA FINAL -->
  <div id="pantallaFinal">

    <img id="comprobante" src="comprobante.jpg" alt="Comprobante del regalo">

    <div id="textoFinal">
      <h2>🌝 Que lo disfrutes!! 🌞</h2>
      <p>Andy, Agus, Pili, Mary, Tata y Mamama</p>
    </div>

  </div>


  <audio id="audio" src="audio.mp3"></audio>


  <script>
    let paso = 0;
    let bloqueado = false;

    document.addEventListener("click", function () {

      // Evita varios clicks mientras gira la carta
      if (bloqueado) return;

      const carta = document.getElementById("carta");
      const contenido = document.getElementById("contenido");
      const pantallaFinal = document.getElementById("pantallaFinal");
      const textoMedio = document.getElementById("textoMedio");
      const audio = document.getElementById("audio");

      // --------------------------------
      // PASO 1 → DAR VUELTA LA CARTA
      // --------------------------------
      if (paso === 0) {

        paso = 1;
        bloqueado = true;

        carta.classList.add("girada");

        // Iniciar música
        audio.currentTime = 0;
        audio.play().catch(() => {});

        // Esperamos a que termine el giro
        setTimeout(() => {

          textoMedio.innerHTML = `
            <h2>👆 Tocá una vez más para recibir tu regalo ✨</h2>
          `;

          bloqueado = false;

        }, 1200);
      }


      // --------------------------------
      // PASO 2 → MOSTRAR REGALO
      // --------------------------------
      else if (paso === 1) {

        paso = 2;

        contenido.style.display = "none";
        pantallaFinal.style.display = "flex";

        // Confetti
        confetti({
          particleCount: 200,
          spread: 120,
          origin: {
            y: 0.6
          }
        });

      }

    });
  </script>

</body>
</html>
